<!doctype html>
<html>
<head><meta charset="utf-8"><title>Formly</title>
<style>body{margin:0;width:310px;padding:20px;font-family:Inter,Arial,sans-serif;background:#0b0c10;color:#f5f5f5}h2{margin:0 0 6px}p{color:#a3a7b2;font-size:13px;line-height:1.5}.btn{width:100%;border:0;border-radius:12px;padding:12px 14px;margin-top:14px;background:#7c5cff;color:#fff;font-weight:700;cursor:pointer}.btn:active{transform:translateY(1px)}.status{margin-top:12px;padding:10px 12px;border-radius:10px;background:#15171d;color:#aeb3bf;font-size:12px;line-height:1.4}</style>
</head>
<body><h2>Formly</h2><p>This button works only on a form that was opened through Formly. The active form stays authorized until its tab is closed or navigated away.</p><button id="fillBtn" class="btn">Fill Form Now</button><div id="status" class="status">Ready</div><script src="popup.js"></script></body></html>
