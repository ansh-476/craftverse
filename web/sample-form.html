<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CraftVerse Sample Form</title><style>body{font-family:system-ui;background:#f5f7fb;padding:40px}.card{max-width:650px;margin:auto;background:white;padding:30px;border-radius:18px;box-shadow:0 15px 50px #0001}label{display:block;margin:14px 0;font-size:13px}input,select{display:block;width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;margin-top:6px;box-sizing:border-box}button{margin-top:15px;padding:12px 20px;border:0;border-radius:8px;background:#6c5ce7;color:white;font-weight:700}</style></head><body><div class="card"><h1>College Application</h1><p>Sample form for testing CraftVerse Autofill.</p><form><label>Applicant Full Name<input name="full_name" autocomplete="name"></label><label>Email Address<input type="email" name="email"></label><label>Mobile Number<input type="tel" name="phone"></label><label>Date of Birth<input type="date" name="dob"></label><label>College / Institution<input name="college"></label><label>Course<input name="course"></label><label>Branch<input name="branch"></label><label>City<input name="city"></label><label>PIN Code<input name="pincode"></label><button type="button">Review Application</button></form></div></body></html>
